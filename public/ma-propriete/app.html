<meta name="referrer" content="no-referrer">

<style>
/* Page privée du Suivi de valeur. Autonome : elle ne charge ni l'application du site, ni Google Analytics. */
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:swap;src:url('/fonts/dmsans-latin.woff2') format('woff2')}
:root{
  --navy:#000E35; --navy-2:#0B1A47; --ink:#0B1533; --muted:#4F5874; --faint:#7C849C;
  --line:#E4E7EF; --bg:#F4F5F9; --card:#FFFFFF; --pale:#D4DAEA; --wash:#EEF1F8;
  --red:#FF1200; --red-ink:#C80E00;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 1px 2px rgba(0,14,53,.06),0 10px 30px -8px rgba(0,14,53,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scrollbar-color:#B8C0D6 var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
::selection{background:var(--navy);color:#fff}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance;font-weight:650}
a{color:var(--navy);text-underline-offset:3px;text-decoration-thickness:1px}
a:focus-visible,button:focus-visible{outline:3px solid #3366FF;outline-offset:3px;border-radius:10px}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* En-tête */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}
.brand img{width:36px;height:36px}
.brand span{font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand i{width:1px;height:20px;background:var(--line)}
.agent{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.agent b{color:var(--navy);font-weight:600}
.agent img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--wash)}

.demo{background:#FFF6DA;color:#4A3B00;font-size:14px;border-bottom:1px solid #EFDFA8}
.demo .wrap{padding-top:9px;padding-bottom:9px}

/* Bandeau */
.hero{background:var(--navy);color:#fff;overflow:hidden}
.hero .wrap{display:block}
.hero-txt{padding:44px 0 100px;display:flex;flex-direction:column;gap:10px;max-width:620px}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.06;font-weight:650;letter-spacing:-.03em}
.hero .addr{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.78);font-size:15px}
.hero .what{color:rgba(255,255,255,.88);font-size:16.5px;max-width:520px;margin-top:4px}

/* Grille */
.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:24px;margin-top:-64px;padding-bottom:64px;position:relative}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px}
.card h2{font-size:21px;line-height:1.2}
.sub{color:var(--muted);font-size:15px;margin-top:4px}

/* Fourchette */
.range-card{padding:30px 30px 26px}
.range-card h2{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.big{font-size:clamp(34px,8.2vw,52px);line-height:1;font-weight:650;letter-spacing:-.04em;color:var(--navy);margin-top:10px;font-variant-numeric:tabular-nums}
.big .to{font-weight:400;color:var(--faint);letter-spacing:-.02em}
.stamp{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--muted)}
.stamp svg{color:#1C8C5A}
.scale{margin-top:26px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-direction:column;gap:8px}
.row .lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px;color:var(--muted)}
.row .lab b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.now .lab span{color:var(--ink);font-weight:600}
.track{position:relative;height:12px;border-radius:99px;background:var(--wash)}
.seg{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--pale);transition:left .9s var(--ease),width .9s var(--ease)}
.row.now .seg{background:var(--navy)}
.why{margin-top:22px;font-size:17px;line-height:1.5;color:var(--ink)}
.lim{margin-top:18px;display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:14px 16px;font-size:14.5px;color:var(--muted)}
.lim svg{color:var(--navy);margin-top:1px}
.note{margin-top:14px;display:flex;gap:12px;align-items:flex-start;background:#EAF1FF;color:#14306E;border-radius:14px;padding:14px 16px;font-size:14.5px}

/* Marché */
.chart{margin-top:22px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--red)}
.cap{margin-top:10px;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.stat{background:var(--bg);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat span{font-size:13.5px;color:var(--muted);line-height:1.35}
.stat b{font-size:26px;font-weight:650;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
.src{margin-top:14px;font-size:13px;color:var(--faint)}
.read{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line);margin-top:22px;padding-top:20px}
.read img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 12%;flex:none;background:var(--wash)}
.read b{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:2px}

/* Courtier */
.me-card{padding:0;overflow:hidden}
.me-top{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:14px;padding:24px 24px 18px;border-bottom:1px solid var(--line)}
.me-top img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--wash)}
.me-top small{display:block;font-size:13px;color:var(--muted)}
.me-top b{display:block;font-size:18px;font-weight:650;letter-spacing:-.015em;color:var(--navy);line-height:1.2}
.me-top em{display:block;font-style:normal;font-size:13.5px;color:var(--muted);margin-top:2px}
.me-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.me-body q{quotes:"«\00a0" "\00a0»";font-size:17px;font-weight:600;line-height:1.35;color:var(--navy);letter-spacing:-.01em}
.me-body h3{font-size:18px;margin-top:6px}
.me-body p{font-size:15px;color:var(--muted)}
.btn{min-height:50px;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:14px;font-size:15.5px;font-weight:600;text-decoration:none;border:1.5px solid transparent;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.line{border-color:var(--line);color:var(--navy);background:#fff}
.btn.line:hover{border-color:var(--navy)}
.how{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;font-size:15px;color:var(--ink)}
.how li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--wash);color:var(--navy);font-weight:650;font-size:14px;display:grid;place-items:center}
.small p{font-size:15px;color:var(--muted);margin-top:8px}
.small .btn{margin-top:16px}
.rows{margin-top:12px;font-size:15px}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.rows span{color:var(--muted)}
.rows b{font-weight:600;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:14.5px}

/* Barre d'action mobile */
.bar{display:none}

.foot{background:var(--navy);color:rgba(255,255,255,.82);font-size:13px;line-height:1.55}
.foot .wrap{padding-top:26px;padding-bottom:30px;display:flex;flex-direction:column;gap:12px}
.foot a{color:#fff}
.foot .line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;align-items:center}
.logos{display:flex;align-items:center;gap:12px}
.logos i{width:1px;height:16px;background:var(--red)}
.logos img.mw{height:13px;width:auto}
.logos img.rx{height:24px;width:auto}

.state{max-width:560px;margin:0 auto;padding:80px 20px;display:flex;flex-direction:column;gap:14px}
.state h1{font-size:30px;line-height:1.12}
.state p{color:var(--muted)}
.state .btn{align-self:flex-start}
.load{display:flex;flex-direction:column;gap:14px;padding:64px 20px;max-width:1120px;margin:0 auto}
.sk{height:18px;border-radius:9px;background:linear-gradient(90deg,#E8EBF2,#F3F5F9,#E8EBF2);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr);margin-top:-56px;padding-bottom:110px}
  .agent span{display:none}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line)}
  .bar .btn{min-height:48px}
  .me-card .btns{display:none}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .hero-txt{padding:28px 0 84px}
  .hero .what{display:none}
  .card,.range-card{padding:22px 20px}
  .me-card{padding:0}
  .me-top{padding:20px 20px 16px}
  .me-body{padding:18px 20px 20px}
  .stats{grid-template-columns:1fr}
  .what-m{display:block!important}
}
.what-m{display:none;font-size:16px;color:var(--ink);margin:0 0 4px}
@media (prefers-reduced-motion:reduce){.seg,.btn{transition:none}.sk{animation:none}}
</style>
</head>

  function chart(serie,W,mark){
    if(!serie||serie.length<2) return "";
    var H=W<480?210:250,pl=0,pr=0,pt=40,pb=34,vals=serie.map(function(s){return s.med;});
    var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),pad=Math.max((hi-lo)*.7,hi*.012);lo-=pad;hi+=pad*.6;
    var x=function(i){return pl+18+(W-pl-pr-36)*i/(serie.length-1);},y=function(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));};
    var P=serie.map(function(s,i){return [x(i),y(s.med)];});
    var d="M"+P.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" L");
    var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(serie.map(function(s){return qshort(s.t)+" : "+money(s.med);}).join(", "))+'">';

    g+='<path d="'+d+' L'+P[P.length-1][0].toFixed(1)+','+(H-pb)+' L'+P[0][0].toFixed(1)+','+(H-pb)+' Z" fill="#EEF1F8"/>';
    g+='<path d="'+d+'" fill="none" stroke="#000E35" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/>';
    var F="DM Sans, system-ui, sans-serif";
    serie.forEach(function(s,i){var px=P[i][0],py=P[i][1],first=i===0,last=i===serie.length-1,isMark=s.t===mark;
      var anchor=first?"start":(last?"end":"middle"),tx=first?px-6:(last?px+6:px);
      g+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(last||isMark?6:4)+'" fill="'+(isMark?"#FF1200":"#000E35")+'" stroke="#fff" stroke-width="2.5"/>';
      if(first||last) g+='<text x="'+tx.toFixed(1)+'" y="'+(py-15).toFixed(1)+'" text-anchor="'+anchor+'" font-size="14.5" font-weight="650" fill="#000E35" font-family="'+F+'">'+esc(money(s.med))+'</text>';

    });
    return g+'</svg>';
  }

       '<p class="big"><span class="num">'+esc(money(cur.basse))+'</span> <span class="to">'+esc(to().trim())+'</span> <span class="num">'+esc(money(cur.haute))+'</span></p>'+
       '<p class="stamp">'+(a?ICON.check:ICON.clock)+'<span>'+esc(a?t.upd(date(a.approuveLe)):t.upd0(date(dep.date)))+'</span></p>';
    if(a){
      h+='<div class="scale">'+
         '<div class="row"><div class="lab"><span>'+esc(t.cmpA(date(dep.date)))+'</span><b>'+esc(money(dep.basse))+esc(to())+esc(money(dep.haute))+'</b></div><div class="track"><span class="seg" style="left:'+pd.l+'%;width:'+pd.w+'%"></span></div></div>'+
         '<div class="row now"><div class="lab"><span>'+esc(t.cmpB)+'</span><b>'+esc(money(a.basse))+esc(to())+esc(money(a.haute))+'</b></div><div class="track"><span class="seg" id="segNow" data-l="'+pc.l+'" data-w="'+pc.w+'" style="left:'+pd.l+'%;width:'+pd.w+'%"></span></div></div>'+
         '</div><p class="why">'+esc(why)+'</p>';
    }
    h+='<p class="lim">'+ICON.info+'<span>'+esc(t.lim)+'</span></p>'+(newer?'<p class="note">'+ICON.clock+'<span>'+esc(t.newer)+'</span></p>':'')+'</section>';
    h+='<section class="card"><h2>'+esc(t.mktT)+'</h2>'+(ty?'<p class="sub">'+esc(ty+" "+loc)+'</p>':'');
    if(m.length>=2&&ty) h+='<div class="chart" id="chart"></div><p class="legend"><i aria-hidden="true"></i>'+esc(t.cmpA(date(dep.date)))+'</p><p class="cap">'+esc(t.chartC)+'</p>'+
       '<div class="sr"><table><caption>'+esc(t.mktT)+'</caption><tbody>'+m.map(function(x){return '<tr><th scope="row">'+esc(qshort(x.t))+'</th><td>'+esc(money(x.med))+'</td></tr>';}).join("")+'</tbody></table></div>';
    if(last){h+='<div class="stats"><div class="stat"><span>'+esc(t.med(qlong(last.t)))+'</span><b>'+esc(money(last.med))+'</b></div><div class="stat"><span>'+esc(t.ventes)+'</span><b>'+esc(num(last.ventes))+'</b></div></div>'+
        '<p class="src">'+esc(t.src(placeName(c.secteurIndice)))+'</p>';}
    else h+='<p class="sub">'+esc(t.nomkt)+'</p>';
    if(c.lecture) h+='<div class="read"><img src="/ma-propriete/yanis-about-sm.webp" alt="" width="48" height="48"><div><b>'+esc(t.lecture)+'</b><p>'+esc(c.lecture)+'</p></div></div>';
    h+='</section></div><aside class="col">';
    h+='<section class="card me-card"><div class="me-top"><img src="/ma-propriete/yanis-about-sm.webp" alt="" width="64" height="64"><div><small>'+esc(t.contactT)+'</small><b>Yanis Gauthier-Sigeris</b><em>'+esc(t.role)+'</em></div></div>'+
       '<div class="me-body"><q>'+esc(t.sig)+'</q><h3>'+esc(t.ctaT)+'</h3><p>'+esc(t.ctaP)+'</p><div class="btns" style="display:flex;flex-direction:column;gap:10px">'+
       '<a class="btn primary" href="'+esc(mailto(t.sAna,c))+'">'+ICON.mail+esc(t.cta1)+'</a><a class="btn line" href="'+TELH+'">'+ICON.phone+esc(t.cta2)+' · '+TEL+'</a></div></div></section>';

    h+='<section class="card small"><h2>'+esc(t.worksT)+'</h2><p>'+esc(t.worksP)+'</p><a class="btn line" href="'+esc(mailto(t.sWorks,c))+'">'+esc(t.works)+'</a></section>';
    h+='<section class="card small"><h2>'+esc(t.prefT)+'</h2><div class="rows"><div><span>'+esc(t.freq)+'</span><b>'+esc(t.F[c.frequence]||t.F.C)+'</b></div></div><div class="links"><a href="'+esc(mailto(t.sFreq,c))+'">'+esc(t.prefs)+'</a><a href="'+esc(mailto(t.sStop,c))+'">'+esc(t.unsub)+'</a></div></section>';
    h+='</aside></div></div>';

      if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)go();else requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(go,250);});});}
  }

    $("app").innerHTML='<div class="state"><h1>'+esc(title)+'</h1><p>'+esc(p)+'</p>'+(retry?'<button class="btn line" type="button" id="retry" style="cursor:pointer;font:inherit;font-weight:600">'+esc(label)+'</button>':'<a class="btn primary" href="'+esc(href)+'">'+ICON.mail+esc(label)+'</a>')+'</div>';
    if(retry) $("retry").addEventListener("click",load);
  }
  function token(){var h=(location.hash||"").replace(/^#/,""),q=new URLSearchParams(location.search);return (q.get("c")||h||"").trim();}

    setLang(/^\/en\//.test(location.pathname)||ql==="en"?"en":(ql==="tu"?"tu":"vous"));
