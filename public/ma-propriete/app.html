<style>
/* Page privée du Suivi de valeur. Autonome : elle ne charge ni l'application du site, ni Google Analytics. */
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:swap;src:url('/fonts/dmsans-latin.woff2') format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:500 700;font-display:swap;src:url('/fonts/intertight-latin.woff2') format('woff2')}
:root{
  --navy:#000E35; --ink:#0C1A3F; --muted:#3B4560; --line:#DDE0E8; --cream:#F7F4EE; --card:#FFFFFF;
  --blue:#3366FF; --soft:#EEF1F8; --red:#FF1200;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --head:'Inter Tight','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--head);letter-spacing:-.02em;text-wrap:balance}
a{color:var(--navy)}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.in{max-width:1120px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

.top{background:var(--navy);color:#fff}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff}
.brand img{height:44px;width:44px;object-fit:contain}
.brand span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.agent{display:flex;align-items:center;gap:10px}
.agent img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:#fff}
.agent small{display:block;font-size:12px;color:rgba(255,255,255,.8)}
.agent b{font-size:14px;font-weight:600}

.demo{background:#FFF4D6;border-bottom:1px solid #EAD9A6;color:#4A3B00;font-size:14px}
.demo .in{padding-top:9px;padding-bottom:9px}

.hello{padding:34px 0 6px;display:flex;flex-direction:column;gap:8px}
.hello h1{font-size:clamp(28px,4.6vw,40px);line-height:1.08;font-weight:600}
.hello p{color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;padding:20px 0 56px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:21px;line-height:1.2;font-weight:600}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.range{overflow-wrap:anywhere;font-family:var(--head);font-weight:600;font-size:clamp(30px,5.4vw,46px);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meta{font-size:14px;color:var(--muted)}
.delta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14.5px}

.chart{position:relative;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.chart h3{font-size:15px;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12.5px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--cream);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--head);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.read{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line);padding-top:16px}
.read img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 8%;flex:none;background:var(--cream)}
.read p{font-size:16px;line-height:1.6}

.cta{background:var(--navy);color:#fff;border-color:var(--navy)}
.cta h2{color:#fff}
.cta p{color:rgba(255,255,255,.88);font-size:15px}
.btn{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;text-decoration:none;border:1px solid transparent}
.btn.white{background:#fff;color:var(--navy)}
.btn.ghost{border-color:rgba(255,255,255,.6);color:#fff}
.btn.line{border-color:var(--navy);color:var(--navy)}
.rows{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows b{font-weight:600;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px}

.foot{background:var(--navy);color:rgba(255,255,255,.86);font-size:13px;line-height:1.55}
.foot .in{padding-top:22px;padding-bottom:28px;display:flex;flex-direction:column;gap:12px}
.foot .line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;align-items:center}
.logos{display:flex;align-items:center;gap:12px}
.logos i{width:1px;height:16px;background:var(--red)}
.logos img.mw{height:13px;width:auto}
.logos img.rx{height:24px;width:auto}

.state{max-width:560px;margin:0 auto;padding:72px 20px;display:flex;flex-direction:column;gap:14px;text-align:left}
.state h1{font-size:30px;line-height:1.12;font-weight:600}
.state p{color:var(--muted)}
.state .btn{align-self:flex-start}

@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:1fr 1fr}.agent small{display:none}}
@media (max-width:420px){.card{padding:20px}.stats{grid-template-columns:1fr}.agent b{display:none}}
</style>
</head>

  function chart(serie,W){
    if(!serie||serie.length<2) return "";
    var H=220,pl=8,pr=8,pt=30,pb=30,vals=serie.map(function(s){return s.med;});

    h+='<section class="card"><h2>'+esc(last?t.sector(qshort(last.t)):t.sector("…"))+'</h2>';
    if(last){h+='<div class="stats"><div class="stat"><span>'+esc(t.med)+'</span><b>'+esc(money(last.med))+'</b></div><div class="stat"><span>'+esc(t.ventes)+'</span><b>'+esc(num(last.ventes))+'</b></div>'+
        (mov!==null?'<div class="stat"><span>'+esc(t.mov)+'</span><b>'+esc(Math.abs(mov)<0.005?t.stable:pct(mov))+'</b></div>':'')+'</div><p class="meta">'+esc(t.src(placeName(c.secteurIndice),qshort(last.t)))+'</p>';}
    else h+='<p class="meta">'+esc(t.nomkt)+'</p>';
    if(c.lecture) h+='<div class="read"><img src="/ma-propriete/yanis-about-sm.webp" alt="Yanis Gauthier-Sigeris" width="52" height="52"><div><p class="eyebrow">'+esc(t.lecture)+'</p><p>'+esc(c.lecture)+'</p></div></div>';
    h+='</section></div><aside class="col">';
    h+='<section class="card cta"><h2>'+esc(t.ctaT)+'</h2><p>'+esc(t.ctaP)+'</p><a class="btn white" href="'+esc(mailto(t.sAna,c))+'">'+esc(t.cta1)+'</a><a class="btn ghost" href="'+TELH+'">'+esc(t.cta2)+' · '+TEL+'</a></section>';
    if(a) h+='<section class="card"><p class="eyebrow">'+esc(t.startT)+'</p><p class="range" style="font-size:24px">'+esc(money(dep.basse))+(L==="en"?" to ":" à ")+esc(money(dep.haute))+'</p><p class="meta">'+esc(t.start(date(dep.date)))+'</p></section>';
    h+='<section class="card"><h2>'+esc(t.worksT)+'</h2><p class="meta">'+esc(t.worksP)+'</p><a class="btn line" href="'+esc(mailto(t.sWorks,c))+'">'+esc(t.works)+'</a></section>';
    h+='<section class="card"><h2>'+esc(t.prefT)+'</h2><div class="rows"><div><span>'+esc(t.freq)+'</span><b>'+esc(t.F[c.frequence]||t.F.C)+'</b></div></div><div class="links"><a href="'+esc(mailto(t.sFreq,c))+'">'+esc(t.prefs)+'</a><a href="'+esc(mailto(t.sStop,c))+'">'+esc(t.unsub)+'</a></div></section>';
    h+='</aside></div></div>';
    $("app").innerHTML=h;
  }
  function state(title,p,label,href,retry){
    $("app").innerHTML='<div class="state"><h1>'+esc(title)+'</h1><p>'+esc(p)+'</p>'+(retry?'<button class="btn line" type="button" id="retry" style="background:none;cursor:pointer;font:inherit;font-weight:600">'+esc(label)+'</button>':'<a class="btn line" href="'+esc(href)+'">'+esc(label)+'</a>')+'</div>';
    if(retry) $("retry").addEventListener("click",load);
  }

  function token(){var h=(location.hash||"").replace(/^#/,""),q=new URLSearchParams(location.search);return (q.get("c")||h||"").trim();}
  function load(){
    var tk=token(),q=new URLSearchParams(location.search),ql=q.get("l");
    setLang(/^\/en\//.test(location.pathname)||ql==="en"?"en":(ql==="tu"?"tu":"vous"));
    $("t-load")&&($("t-load").textContent=t.load);
    if(!tk){state(t.nfT,t.nfP,t.nfB,mailto(t.sLink));return;}
    fetch("/.netlify/functions/ma-propriete?c="+encodeURIComponent(tk)+(tk==="demo"&&ql?"&l="+encodeURIComponent(ql):""),{headers:{Accept:"application/json"},cache:"no-store",referrerPolicy:"no-referrer"})
      .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
      .then(function(x){
        if(x.s===404||(x.j&&x.j.erreur==="introuvable")){state(t.nfT,t.nfP,t.nfB,mailto(t.sLink));return;}
        if(!x.j||!x.j.ok||!x.j.client){state(t.errT,t.errP,t.errB,"",true);return;}
        setLang(x.j.client.langue);
        if(x.j.demo){$("demo").hidden=false;$("t-demo").textContent=t.demo;}
        view(x.j);
      })
      .catch(function(){state(t.errT,t.errP,t.errB,"",true);});
  }
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(lastData&&cw()!==lastW)view(lastData);},150);});
  load();
})();
</script>
